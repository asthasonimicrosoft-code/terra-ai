```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraAI - Touch Grass</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>

<header>
    <h2>🌿 TerraAI</h2>
    <button id="theme">🌙</button>
</header>

<section class="hero">
    <h1>A little less scrolling.<br>
        <span>A lot more living.</span>
    </h1>
    <p>Let AI help you discover the joy of outdoor activities.</p>
    <a href="#planner" class="btn">Find My Activity</a>
</section>

<section id="planner">
    <h2>Your Outdoor AI Planner</h2>

    <input id="mood" placeholder="How are you feeling?">

    <select id="time">
        <option value="10">10 minutes</option>
        <option value="20">20 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">1 hour</option>
    </select>

    <select id="activity">
        <option value="any">Surprise me</option>
        <option value="walking">Walking</option>
        <option value="gardening">Gardening</option>
        <option value="birds">Birdwatching</option>
        <option value="mindfulness">Mindfulness</option>
    </select>

    <button id="generate" class="btn">Generate My Plan</button>

    <div id="result"></div>
</section>

<section class="about">
    <h2>Explore the Real World</h2>
    <p>🌳 Walking · 🌱 Gardening · 🐦 Birdwatching</p>
    <p>Powered by open-source AI technology.</p>
</section>

<script src="app.js"></script>
</body>
</html>
